name: SauceDemo Playwright Python CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html pytest-json-report

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Create artifact directories
        run: mkdir -p artifacts/test-results playwright-report test-results

      - name: Run Playwright tests with trace/video/screenshot on failure
        run: |
          pytest tests \
            --browser chromium \
            --base-url https://www.saucedemo.com \
            --html=playwright-report/index.html \
            --self-contained-html \
            --json-report \
            --json-report-file=artifacts/test-results/results.json \
            --output test-results \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/

      - name: Upload JSON test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: artifacts/test-results/

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
